name: Scheduled tests

on:
  schedule:
    - cron: "3-59/5 * * * *"   # ВРЕМЕННО: каждые 5 минут, чтобы проверить расписание
    - cron: "17 23 * * *"      # каждый день в 02:17 по Москве
    - cron: "7 11 * * 6"       # каждую субботу в 14:07 по Москве
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Установить зависимости
        run: pip install pytest ruff

      - name: Линтер
        run: ruff check .

      - name: Форматирование
        run: ruff format --check .

      - name: Тесты
        run: python -m pytest -v